# API gateway: the single entry point in front of the app.
# Clients talk only to the gateway (port 80); it forwards each request to the right service.
# "api" below is the Docker Compose service name - Compose's DNS finds the container (service discovery).

events {}

http {
  # Gateway-level rate limit: 20 requests/second per client IP, short bursts allowed
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  # The upstream service. With several API containers, Nginx would load-balance across them.
  upstream crm_api {
    server api:5000;
  }

  server {
    listen 80;
    client_max_body_size 3m; # CSV and photo uploads (the API itself allows 2 MB)

    # A request id ties together the gateway log and the API log for one request
    add_header X-Request-Id $request_id always;

    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      proxy_pass http://crm_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    # Everything else (home page, React app, static files) also goes to the API service
    location / {
      proxy_pass http://crm_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The gateway's own health check
    location = /gateway/health {
      return 200 'ok';
    }
  }
}

