# Continuous Integration: every push and pull request is checked automatically on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint and test the API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The tests start their own in-memory MongoDB - no database service needed
      - run: npm test

  client:
    name: Build the React client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
