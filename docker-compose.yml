# The whole stack on one machine:   docker compose up --build
# Then open http://localhost (through the API gateway) or http://localhost:5000 (the API directly).
# Demo data:                        docker compose exec api node scripts/seed.js
#
#   browser -> gateway (Nginx, port 80) -> api (Express, 5000) -> mongo, redis

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db # named volume: data survives "docker compose down"
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      MONGO_URI: mongodb://mongo:27017/crm # "mongo" is the service name - Compose's built-in DNS (service discovery)
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-string}
      CLIENT_URL: http://localhost:5000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # API gateway: single entry point, rate limiting, request ids, finds "api" by name
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  mongo-data:

